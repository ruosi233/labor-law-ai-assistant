[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-law-ai"
version = "0.1.0"
description = "基于 LangGraph、LangChain 和 Chroma 的劳动用工法律 AI 助手"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

